name: Auto-Dependency-Updater

on:
  schedule:
    - cron: '0 0 * * 1'  # Run every Monday at midnight
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  update_dependencies:
    runs-on: ubuntu-latest
    env:
      TOKEN: ${{ secrets.TOKEN }}
      USERNAME: "apoorv-katiyar"
      EMAILID: "katiyar.apoorv97@gmail.com"
      NEXUS_URL: ${{ secrets.NEXUS_URL }}
      NEXUS_USER: ${{ secrets.NEXUS_USER }}
      NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            openjdk-11-jdk \
            maven \
            gradle \
            jq \
            curl \
            gh \
            docker.io

      - name: Install Node.js Global Tools
        run: |
          npm install -g npm-check-updates

      - name: Install Python Tools
        run: |
          pip install --upgrade pip
          pip install pip-tools pytest poetry

      - name: Configure Git
        run: |
          git config --global user.name "$USERNAME"
          git config --global user.email "$EMAILID"

      - name: Run Dependency Updater Script
        env:
          GH_TOKEN: ${{ secrets.TOKEN }}
          NEXUS_URL: ${{ secrets.NEXUS_URL }}
          NEXUS_USER: ${{ secrets.NEXUS_USER }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          echo "Running Dependency Updater Script..."
          bash dependency-updater.sh 2>&1 | tee dependency-updater.log || {
            echo "❌ Error occurred while running dependency-updater.sh. Check the log below."
            cat dependency-updater.log
            exit 1
          }
          echo "✅ Dependency update completed successfully."

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: dependency-updater-logs
          path: |
            dependency-updater.log
            changelog.txt

      - name: Review results if failed
        if: failure()
        run: |
          echo "❌ Dependency Update Failed. Check the logs for details."
          cat dependency-updater.log || echo "No log file found."
          echo "Please review the changes and try again."
          echo "If you need assistance, please contact the repository maintainer."
